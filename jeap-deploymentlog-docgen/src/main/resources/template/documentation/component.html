<th:block xmlns:th="http://www.thymeleaf.org">
    <div th:replace="~{fragment/generated-infoblock :: generated-infoblock}"></div>

    <h2>Version Flows</h2>
    <p th:if="${component.flows.isEmpty()}">Für diese Komponente sind noch keine Version Flows bekannt.</p>
    <table class="wrapped" th:unless="${component.flows.isEmpty()}" style="table-layout: fixed; width: 100%;">
        <tbody>
        <tr>
            <th>Version</th>
            <th>Beginn</th>
            <th>Dauer</th>
            <th>Typ</th>
            <th>Zustand</th>
            <th>Ziel-Stage</th>
            <th>Deployments</th>
            <th>Jira Issues</th>
            <th>Bewertung</th>
        </tr>
        <tr th:each="flow: ${component.flows}">
            <td style="overflow-wrap: anywhere;">
                <a th:if="${flow.versionControlUrl != null and !flow.versionControlUrl.isBlank()}"
                   th:href="${flow.versionControlUrl}" th:text="${flow.version}" target="_blank"></a>
                <span th:unless="${flow.versionControlUrl != null and !flow.versionControlUrl.isBlank()}"
                      th:text="${flow.version}"></span>
            </td>
            <td th:text="${flow.bornAt}"></td>
            <td th:text="${flow.duration == null ? '—' : flow.duration}"></td>
            <td th:text="${flow.type}"></td>
            <td><strong th:text="${flow.state}"></strong></td>
            <td th:text="${flow.targetStage}"></td>
            <td>
                <table class="wrapped" style="width: 100%;">
                    <tbody>
                    <tr th:each="deployment: ${flow.deployments}">
                        <td th:text="${deployment.startedAt}"></td>
                        <td th:text="${deployment.stage}"></td>
                        <td th:text="${deployment.state}"></td>
                        <td>
                            <ac:link th:if="${deployment.pageId != null}">
                                <ri:page th:ri:content-id="${deployment.pageId}"/>
                                <ac:plain-text-link-body><![CDATA[Detail]]></ac:plain-text-link-body>
                            </ac:link>
                            <span th:unless="${deployment.pageId != null}">—</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </td>
            <td>
                <span th:if="${flow.jiraIssues.isEmpty()}">—</span>
                <th:block th:each="issue, iter: ${flow.jiraIssues}">
                    <a th:if="${issue.url != null}" th:href="${issue.url}" th:text="${issue.key}" target="_blank"></a>
                    <span th:unless="${issue.url != null}" th:text="${issue.key}"></span><span th:unless="${iter.last}">, </span>
                </th:block>
            </td>
            <td style="overflow-wrap: anywhere;" th:text="${flow.evaluation}"></td>
        </tr>
        </tbody>
    </table>
    <p>Zeigt maximal <span th:text="${component.flowMaxShow}"></span> aktuelle Version Flows.</p>
</th:block>
